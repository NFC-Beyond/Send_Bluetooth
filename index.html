<style>
  :root { --bg: #eef3f8; --card: #ffffff; --ink: #1b2430; --muted: #5a6878; --accent: #2563eb; --ok: #15803d; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1620; --card: #18222f; --ink: #e6edf5; --muted: #9aa8b8; --accent: #4f8cff; --ok: #4ade80; --err: #f87171; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif;
         padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right)); }
  .card { max-width: 420px; margin: 0 auto; background: var(--card); border-radius: 18px; padding: 24px; box-shadow: 0 1px 4px #0002; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--muted); line-height: 1.5; }
  .now { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 18px 0 2px; }
  .date { color: var(--muted); margin-bottom: 18px; }
  button { width: 100%; font-size: 19px; padding: 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
  button:disabled { opacity: .6; }
  #status { min-height: 1.5em; margin-top: 14px; font-weight: 500; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<div class="card">
  <h1>Send time to your clock</h1>
  <p>Turn on Bluetooth, keep the clock close, and tap the button. Pick the clock (named <b>clock-xxxx</b>) from the list.</p>
  <div class="now" id="now">--:--:--</div>
  <div class="date" id="date"></div>
  <button id="send">Send time</button>
  <div id="status"></div>
  <p id="help" hidden>This browser can't use Bluetooth. On Android, open this page in <b>Chrome</b>. On iPhone, open it in the free <b>Bluefy</b> app.</p>
</div>
<script>
  const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const btn = document.getElementById('send');
  const status = document.getElementById('status');

  function tick() {
    const d = new Date();
    document.getElementById('now').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 1000);

  // save the page on the phone so it also opens without internet
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  if (!navigator.bluetooth) { btn.disabled = true; document.getElementById('help').hidden = false; }

  function say(text, cls) { status.textContent = text; status.className = cls || ''; }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      say('Looking for the clock...');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'clock-' }, { services: [SERVICE] }],
        optionalServices: [SERVICE]
      });
      say('Connecting to ' + device.name + '...');
      const server = await device.gatt.connect();
      const rx = await (await server.getPrimaryService(SERVICE)).getCharacteristic(RX);
      // send the time right before writing, so it is as exact as possible
      const seconds = Math.floor(Date.now() / 1000);
      const offset = -new Date().getTimezoneOffset() * 60;
      await rx.writeValue(new TextEncoder().encode('T ' + seconds + ' ' + offset));
      say('Time sent! Check the clock.', 'ok');
      setTimeout(() => device.gatt.disconnect(), 800);
    } catch (e) {
      if (e && e.name === 'NotFoundError') say('No clock picked. Is it showing "Set the time" or "B" in the corner?', 'err');
      else say('Could not send: ' + (e && e.message ? e.message : e), 'err');
    } finally {
      btn.disabled = !navigator.bluetooth;
    }
  });
</script>
</body>
</html>
